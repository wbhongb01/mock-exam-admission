# mock-exam-admission 폴더(정적 사이트)를 GitHub Pages로 배포합니다.
name: Deploy site to GitHub Pages

on:
  push:
    branches: [feat/mock-exam-admission]
    paths: ["mock-exam-admission/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: mock-exam-admission
      - id: deployment
        uses: actions/deploy-pages@v4
