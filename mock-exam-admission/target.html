<head>
  <meta charset="utf-8" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet" />
  <link rel="icon" href="img/logo.svg" type="image/svg+xml" />
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <nav class="topnav">
    <div class="wrap">
      <a class="brand" href="index.html"><img class="brand-mark" src="img/logo.svg" alt="" />모의고사 대학 찾기</a>
      <div class="links">
        <a href="input.html">성적 입력</a>
        <a href="result.html">결과 보기</a>
        <span class="nav-sep" aria-hidden="true"></span>
        <a href="target.html" aria-current="page">목표 학과</a>
        <a href="method.html">계산 방법</a>
      </div>
    </div>
  </nav>

  <main class="wrap page">
    <h1 class="page-title">목표 학과 합격선 보기</h1>
    <p class="page-sub">가고 싶은 학교와 학과를 고르면, <span data-year></span>학년도 정시에서 합격하려면 어느 정도 <b>백분위·등급</b>이 필요했는지 알려줘요.</p>

    <section class="card">
      <div class="row">
        <fieldset class="seg">
          <legend>계열</legend>
          <label><input type="radio" name="track" value="전체" checked /> 전체</label>
          <label><input type="radio" name="track" value="인문" /> 문과(인문)</label>
          <label><input type="radio" name="track" value="자연" /> 이과(자연)</label>
        </fieldset>
      </div>
      <div class="grid two">
        <label class="field">
          <span>학교</span>
          <select id="univ"></select>
        </label>
        <label class="field">
          <span>학과 <em id="dept-count"></em></span>
          <select id="dept"></select>
        </label>
      </div>
    </section>

    <section id="detail"></section>
    <section id="univ-list"></section>

    <p class="small-note">
      합격선은 <span data-year></span>학년도 정시 일반전형 최종등록자 <b>70% 학생</b>의 국·수·탐 백분위 평균입니다.
      등급은 백분위를 수능 등급 구간(1등급 96 이상, 2등급 89 이상, 3등급 77 이상 …)으로 바꾼 대략적인 값이에요.
      <a href="method.html">계산 방법 보기</a>
    </p>
  </main>

  <script src="data.js"></script>
  <script src="common.js"></script>
  <script src="ui.js"></script>
  <script src="target.js"></script>
</body>
</html>
